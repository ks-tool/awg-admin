# GoReleaser config for the vpn-admin RELEASE — the root module's admin app.
# Triggered by a `v*` tag (see .github/workflows/release.yml).
#
# The agent and providers live in github.com/ks-tool/vpn-agent and publish OCI
# artifacts independently. This config builds ONLY the admin and migration tool:
#   - vpn-admin: the standalone web server (cmd/vpn-admin.go), embeds the built
#     frontend (see the "before.hooks") — linux/darwin/windows, amd64/arm64.
#   - awg-migrate: the backup/restore and v1-to-v2 migration CLI (cmd/migrate),
#     included in every vpn-admin archive for the same targets.
#   - {IMAGE_ADMIN}: its multi-arch Docker image (linux amd64+arm64, GHCR), the
#     frontend already embedded so the image just copies the binary
#     (docker/Dockerfile.admin). IMAGE_ADMIN is set by the release workflow (the
#     lowercased GHCR image name); arm64 is built under buildx+QEMU.
#
# Deliberately NOT handled here:
#   - vpn-agent and VPN providers: released from their own repository (see above).
#   - The Wails desktop app (Windows/macOS/Linux): needs the `wails` CLI and to
#     run on each target OS's own runner — separate jobs in release.yml that
#     upload their artifacts to the same GitHub release this config creates
#     (hence release.mode: keep-existing).
version: 2

project_name: vpn-admin

before:
  hooks:
    - sh -c "cd frontend && npm ci"
    - make frontend

builds:
  - id: admin
    main: ./cmd/vpn-admin.go
    binary: vpn-admin
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      # `v`-prefix the human-facing version (v1.0.0) — it's shown on the admin
      # Settings page (Service.AppVersion) and logged at startup. {{ .Version }}
      # is the tag with its leading `v` stripped, so add it back. Archive/image
      # names below keep the bare {{ .Version }} by convention.
      - -s -w -X main.version=v{{ .Version }}

  - id: migrate
    main: ./cmd/migrate
    binary: awg-migrate
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w

archives:
  - id: admin-archive
    ids: [admin, migrate]
    name_template: >-
      vpn-admin_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

# Multi-arch image from the prebuilt binary (the modern dockers_v2 pipe: one
# entry builds every platform and its manifest in a single buildx pass). The
# Dockerfile COPYs the binary GoReleaser drops into the build context. arm64 is
# built under buildx+QEMU.
dockers_v2:
  - id: admin
    ids: [admin]
    dockerfile: docker/Dockerfile.admin
    images:
      - "{{ .Env.IMAGE_ADMIN }}"
    tags:
      - "{{ .Version }}"
      - "latest"
    platforms:
      - linux/amd64
      - linux/arm64
    labels:
      org.opencontainers.image.version: "{{ .Version }}"

checksum:
  name_template: "checksums.txt"

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

release:
  mode: keep-existing
  name_template: "VPN Admin v{{ .Version }}"
  replace_existing_artifacts: true
