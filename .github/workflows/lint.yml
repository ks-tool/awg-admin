name: lint

# The agent is linted by its own workflow in github.com/ks-tool/vpn-agent.
on:
  pull_request:

permissions:
  contents: read

jobs:
  golangci-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # main.go and cmd/vpn-admin.go embed the built frontend
      # (`//go:embed cmd/dist`). That directory is a build artifact this job
      # does not build, so the embed pattern would match no files. Create a
      # placeholder to satisfy it; the rest of the package then lints normally.
      - name: Prepare lint targets
        id: prep
        run: |
          mkdir -p cmd/dist && printf '<!doctype html>\n' > cmd/dist/index.html
          targets=$(go list ./... | grep -v /node_modules/ | sed "s|^$(go list -m)|.|" | paste -sd' ' -)
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

      - uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: ${{ steps.prep.outputs.targets }}
